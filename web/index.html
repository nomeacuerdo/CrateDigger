<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discos Collection</title>
<link rel="stylesheet" href="web/style.css">
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>Discos Collection</h1>
      <div class="stats" id="stats"></div>
    </div>
    <button class="theme" id="themeToggle" type="button">Switch to light</button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main>
  <div class="meta"><span id="count"></span><span class="muted"> · click a row for details</span></div>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th id="thReset" title="Reset to collection order">#</th>
          <th data-key="artist">Artist <span class="arrow"></span></th>
          <th data-key="title">Title <span class="arrow"></span></th>
          <th data-key="released">Released <span class="arrow"></span></th>
          <th>Master</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>
<script src="web/app.js"></script>
</body>
</html>
